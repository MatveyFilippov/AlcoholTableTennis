name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_call:
permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: att
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: att_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U att -d att_test" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      ATT_TEST_DATABASE_URL: postgresql+psycopg://att:test-only@127.0.0.1:5432/att_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: mypy att/rules.py att/schemas.py att/db.py
      - run: pytest -q
      - run: DATABASE_URL="$ATT_TEST_DATABASE_URL" alembic check

  frontend-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm exec -- playwright install --with-deps chromium
        working-directory: frontend
      - run: docker compose up --build --wait && infra/scripts/smoke.sh http://127.0.0.1:8080
      - run: npm run e2e
        working-directory: frontend
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: docker compose config --quiet && docker compose build
      - run: infra/scripts/check-infra.sh
