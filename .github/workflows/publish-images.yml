name: Publish images
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: att-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Publish commit image and record its digest
        env:
          COMPONENT: ${{ matrix.component }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-$COMPONENT:sha-$GITHUB_SHA"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if ! docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            docker buildx build --push --tag "$image" --file "infra/$COMPONENT.Dockerfile" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          fi
          docker buildx imagetools inspect "$image" > inspection.txt
          cat inspection.txt >> "$GITHUB_STEP_SUMMARY"
          digest=$(awk '$1 == "Digest:" && !found++ {print $2}' inspection.txt)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$digest" > "$COMPONENT.digest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.component }}-digest
          path: ${{ matrix.component }}.digest
          if-no-files-found: error
          retention-days: 90
